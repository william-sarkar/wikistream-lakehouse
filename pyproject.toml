[project]
name = "wikistream-lakehouse"
version = "0.1.0"
description = "Wikipedia's live edit stream into Kafka, Spark Structured Streaming into Apache Iceberg, dbt marts over Trino, orchestrated by Dagster."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "William Ankan Sarkar" }]
keywords = ["kafka", "spark", "iceberg", "lakehouse", "streaming", "dbt", "dagster", "trino"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: System :: Distributed Computing",
]

dependencies = [
  # Long-lived HTTP/1.1 streaming with independent connect and read timeouts.
  # requests cannot express a read timeout that resets per SSE chunk as cleanly.
  "httpx>=0.28.1,<0.29",
  # librdkafka bindings: the only Python client with a real idempotent producer.
  "confluent-kafka>=2.15.1,<2.16",
  "pydantic>=2.12.0,<3",
  "pydantic-settings>=2.15.0,<3",
  # Only for the Jetstream fallback source. Small enough to keep in the runtime
  # set rather than behind a switch nobody would remember to flip.
  "websockets>=17.1,<18",
]

[project.urls]
Homepage = "https://github.com/william-sarkar/wikistream-lakehouse"
Repository = "https://github.com/william-sarkar/wikistream-lakehouse"

[dependency-groups]
dev = [
  "ruff>=0.16.8,<0.17",
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "sqlfluff>=4.3.0,<5",
  "pre-commit>=4.4.0,<5",
]
# Spark is a group, not a runtime dependency, for two reasons. The Spark
# container already ships pyspark and installing a second copy invites a
# driver/cluster version clash that surfaces as an opaque py4j error; and the
# producer image — the only image built from this project — never imports it, so
# putting it in `dependencies` would add ~400 MB of jars to a service that sends
# JSON to Kafka. The pin must still match the Spark image tag in
# docker-compose.yml exactly, because `make test-spark` runs against this copy.
spark = ["pyspark==4.2.0"]
# dbt and the Trino client. Kept in a group because the transform layer runs in
# its own container and does not belong in the streaming runtime's dependency set.
analytics = [
  "dbt-core>=1.12.5,<1.13",
  "dbt-trino>=1.10.4,<1.11",
  "trino>=0.339.0,<0.340",
  "duckdb>=1.5.5,<1.6",
]
orchestration = [
  "dagster>=1.13.23,<1.14",
  "dagster-webserver>=1.13.23,<1.14",
  "dagster-dbt>=0.29.23,<0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# wikistream_dagster is a sibling package rather than a `dagster/` directory at
# the repo root: a top-level `dagster/` would shadow the installed `dagster`
# package on sys.path and break both `python -m` and mypy's module resolution.
packages = ["src/wikistream", "src/wikistream_dagster"]

[tool.uv]
default-groups = ["dev", "spark", "analytics", "orchestration"]

# ----------------------------------------------------------------------------
# Lint and format
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
# py310, not py312, and this is not a mistake. The Spark image ships Python 3.10.12
# — the interpreter is the base image's, not ours — and every module under
# `src/wikistream/streaming` is imported by `spark-submit` inside that container. A
# 3.11+ idiom in shared code passes every local test on 3.12 and then fails at
# import time in the container, which is where `datetime.UTC` cost an hour. Ruff at
# this target refuses to suggest one (UP017 in particular), and mypy at the same
# version refuses to accept one. See DECISIONS.md ADR-0023.
target-version = "py310"
extend-exclude = ["dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "C4",       # comprehensions
  "SIM",      # simplify
  "PTH",      # use pathlib
  "RET",      # return consistency
  "ARG",      # unused arguments
  "TID",      # tidy imports
  "T20",      # no print() outside scripts
  "RUF",
  "D",        # docstrings
  "ANN",      # type annotations
]
ignore = [
  "D100",  # module docstring not required on every module
  "D104",  # package docstring not required
  "D203",  # conflicts with D211
  "D213",  # conflicts with D212
  "ANN401", # Any is sometimes correct (JSON payloads)
  # `from pyspark.sql import functions as F` is the convention in every Spark
  # codebase and every page of Spark's own documentation. Renaming it to satisfy
  # the linter would make this repo read as unfamiliar to its intended audience.
  "N812",
]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; scripts are CLIs and print.
"tests/**" = ["D", "ANN", "ARG", "S101"]
"scripts/**" = ["T20", "D103"]
# The restart proof runs for minutes and narrates each step as it happens: a test
# that prints nothing for five minutes cannot be told from a hung one, and its
# transcript is what docs/correctness.md quotes. That is why `make test-e2e` runs
# pytest with `-s`.
"tests/e2e/**" = ["T20"]
# A container HEALTHCHECK command. Its stdout is what `docker inspect` shows for
# an unhealthy container, so printing is the interface, not a leftover debug line.
"src/wikistream/producer/healthcheck.py" = ["T20"]
"src/wikistream_dagster/**" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ----------------------------------------------------------------------------
# Types
# ----------------------------------------------------------------------------
[tool.mypy]
# The Spark container's interpreter, for the reason given under [tool.ruff]. Typeshed
# gates `datetime.UTC` on `sys.version_info >= (3, 11)`, so this setting turns "works
# here, ImportError there" into a type error at lint time.
python_version = "3.10"
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "pyspark.*", "duckdb.*", "dagster_dbt.*", "trino.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false

# ----------------------------------------------------------------------------
# Tests
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# So `from doubles import ...` works from any test module. pytest would put
# `tests/` on sys.path anyway as a side effect of importing the root conftest;
# saying it here makes the import legible instead of accidental.
pythonpath = ["tests"]
addopts = "--strict-markers --strict-config -ra"
markers = [
  "unit: pure-Python tests. No network, no Docker, no JVM. Must stay under a second each.",
  "spark: needs a JDK but no Docker. Starts an in-process Spark session, so seconds not milliseconds.",
  "integration: needs the core compose profile running. Skipped when it is not.",
  "e2e: the restart-idempotency proof. Needs the full stack and takes minutes.",
]
filterwarnings = ["error::DeprecationWarning:wikistream.*"]

[tool.coverage.run]
source = ["src/wikistream"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
